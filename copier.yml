project_name:
  type: str
  help: Human-readable project name shown in reports and documentation
  default: Playwright Test Project

project_slug:
  type: str
  help: Python package name in snake_case (used for imports and folder name)
  default: playwright_test

author_name:
  type: str
  help: Author name for pyproject.toml
  default: Your Name

author_email:
  type: str
  help: Author email for pyproject.toml
  default: you@example.com

python_version:
  type: str
  help: Python version for the project (.python-version and pyproject.toml)
  default: "3.12"

base_url:
  type: str
  help: Default base URL for tests (leave empty for absolute URLs in tests)
  default: ""

_exclude:
  - __pycache__
  - "*.pyc"
  - .mypy_cache
  - .ruff_cache
  - .pytest_cache
  - .coverage
  - htmlcov
  - .venv
  - allure-results
  - allure-report
  - .DS_Store
  - "*.egg-info"
  - dist
  - build
  - scripts/
  - copier.yml
  - DEVELOPMENT.md

_answers_file: .copier/.copier-answers.yml

_tasks:
  - ["uv", "sync"]
  - ["uv", "run", "playwright", "install", "--with-deps"]
