[project]
name = "python-playwright"
version = "0.1.0"
description = "Playwright + pytest + Allure UI test automation"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MIT" }

dependencies = [
    "allure-pytest>=2.13.5",
    "playwright>=1.49.0",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.6.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.6.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_playwright"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--alluredir=allure-results",
]
markers = [
    "smoke: fast critical-path checks",
    "regression: broader regression coverage",
    "in_progress: test implementation is not finished yet",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.playwright]
# Used by pytest-playwright; override via CLI or env when needed.

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["python_playwright", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["python_playwright"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
