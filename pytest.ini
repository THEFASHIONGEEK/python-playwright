[pytest]
minversion = 8.0
testpaths = tests

# Specify test file patterns
python_files = test_*.py *_test.py

# Specify test function and class patterns
python_classes = Test*
python_functions = test_*

pythonpath = .
addopts = --strict-markers --strict-config -ra --alluredir=allure-results
markers =
    smoke: fast critical-path checks
    regression: broader regression coverage
    in_progress: test implementation is not finished yet
filterwarnings =
    error
    ignore::DeprecationWarning
